<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Abhinandan Jain</title>
  <meta name="description" content="Client login portal for authorized access.">
  <meta name="keywords" content="Abhinandan Jain, Login, Client Portal, Secure Access">
  <meta name="author" content="Abhinandan Jain">
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Login — Abhinandan Jain">
  <meta property="og:description" content="Client login portal for authorized access.">
  <meta property="og:image" content="abhinandanjain.jpeg">
  <meta property="og:url" content="https://yourdomain.com/login.html">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" type="image/svg+xml">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Locomotive Scroll CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.css" />

  <style>
    /* ========== CSS VARIABLES ========== */
    :root {
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --primary-dark: #1d4ed8;
      --secondary: #10b981;
      --dark: #0f172a;
      --dark-light: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(30, 41, 59, 0.5);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #8b5cf6;
      --transition: all 0.3s ease;
    }

    /* ========== BASE STYLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Fix for scroll container */
    [data-scroll-container] {
      min-height: 100vh;
      width: 100%;
    }

    /* ========== NAVBAR ========== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      z-index: 1000;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      transition: var(--transition);
    }

    .navbar.scrolled {
      padding: 1rem 2rem;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    .menu-toggle {
      display: none;
      color: var(--text);
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 1001;
    }

    .navbar ul {
      display: flex;
      list-style: none;
      gap: 2rem;
      margin: 0;
      padding: 0;
    }

    .navbar a {
      color: var(--text);
      font-weight: 500;
      position: relative;
      padding: 0.5rem 0;
      transition: var(--transition);
    }

    .navbar a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary-light);
      transition: var(--transition);
    }

    .navbar a:hover::after,
    .navbar a.active::after {
      width: 100%;
    }

    .client-login {
      background: linear-gradient(90deg, var(--primary-light), var(--secondary));
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      font-weight: 600;
    }

    .client-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
      color: white;
    }

    .client-login::after {
      display: none;
    }

    /* ========== HERO SECTION ========== */
    .hero {
      padding: 15rem 2rem 6rem;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, var(--dark) 0%, rgba(30, 41, 59, 0.5) 100%);
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      background: linear-gradient(90deg, var(--primary-light), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: 1.4rem;
      max-width: 600px;
      margin: 0 auto 2rem;
      color: var(--text);
    }

    /* ========== LOGIN SECTION ========== */
    .login-section {
      padding: 6rem 2rem;
      background: var(--dark-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }

    .login-container {
      max-width: 400px;
      width: 100%;
      padding: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-container h2 {
      color: var(--primary-light);
      margin-bottom: 1.5rem;
      text-align: center;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      transition: var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: linear-gradient(90deg, var(--primary-light), var(--secondary));
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: var(--transition);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }

    .demo-note {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--secondary);
    }

    /* ========== FOOTER ========== */
    .footer {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--dark);
      border-top: 1px solid var(--card-border);
    }

    /* ========== BACKGROUND CANVAS ========== */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* ========== CUSTOM CURSOR ========== */
    .custom-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary-light);
      mix-blend-mode: difference;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
    }

    /* ========== RESPONSIVE DESIGN ========== */
    @media (max-width: 992px) {
      .navbar ul {
        position: fixed;
        top: 0;
        right: -100%;
        height: 100vh;
        width: 70%;
        background: var(--dark-light);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: right 0.4s ease;
        box-shadow: -5px 0 25px rgba(0, 0, 0, 0.2);
      }
      
      .navbar ul.active {
        right: 0;
      }
      
      .menu-toggle {
        display: block;
      }
    }

    @media (max-width: 576px) {
      .navbar {
        padding: 1rem;
      }
      
      .hero {
        padding: 12rem 1rem 4rem;
      }
      
      .login-section {
        padding: 4rem 1rem;
      }
      
      .login-container {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body data-scroll-container>
  <!-- Animated Background -->
  <canvas id="bg-canvas"></canvas>
  <div class="custom-cursor"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <span class="menu-toggle" aria-label="Toggle navigation menu">&#9776;</span>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="Certificates.html">Certificates</a></li>
      <li><a href="family.html">Family</a></li>
      <li><a href="login.html" class="client-login active">Login</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero" data-scroll-section>
    <h1 data-scroll data-scroll-speed="2">Client Login</h1>
    <p data-scroll data-scroll-speed="1">Secure access to private resources.</p>
  </section>

  <!-- Login Section -->
  <section class="login-section" data-scroll-section>
    <div class="login-container" data-scroll data-scroll-speed="1">
      <h2>Sign In</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter your password" />
        </div>
        <button type="submit" class="login-btn">Log In</button>
      </form>
      <p class="demo-note">Demo: Use any email & password to proceed.</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" data-scroll-section>
    <div class="container">
      <p>&copy; 2025 Abhinandan Jain. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
  <script>
    // Initialize Locomotive Scroll after page loads
    document.addEventListener("DOMContentLoaded", () => {
      const scroll = new LocomotiveScroll({
        el: document.querySelector('[data-scroll-container]'),
        smooth: true,
        smartphone: { smooth: true },
        tablet: { smooth: true }
      });

      // Refresh scroll on window resize
      window.addEventListener('resize', () => scroll.update());
      
      // Navbar scroll effect
      window.addEventListener('scroll', () => {
        const navbar = document.querySelector('.navbar');
        if (window.scrollY > 50) {
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
      });
    });

    // Mobile Menu Toggle
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('.navbar ul');
    
    if (menuToggle && navMenu) {
      menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        menuToggle.textContent = navMenu.classList.contains('active') ? '✕' : '☰';
      });

      document.querySelectorAll('.navbar a').forEach(link => {
        link.addEventListener('click', () => {
          navMenu.classList.remove('active');
          menuToggle.textContent = '☰';
        });
      });
    }

    // Login Form Submission
    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Login successful! (Demo mode)');
    });

    // Starfield Background
    const canvas = document.getElementById("bg-canvas");
    if (canvas) {
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let stars = [];
      const STAR_COUNT = 200;

      function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            z: Math.random() * canvas.width,
          });
        }
      }

      function drawStars() {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";

        for (let i = 0; i < stars.length; i++) {
          const star = stars[i];
          star.z -= 1;
          if (star.z <= 0) {
            star.z = canvas.width;
          }
          const k = 128.0 / star.z;
          const px = star.x * k + canvas.width / 2;
          const py = star.y * k + canvas.height / 2;

          if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
            const size = (1 - star.z / canvas.width) * 3;
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function animateBackground() {
        drawStars(); 
        requestAnimationFrame(animateBackground);
      }

      initStars();
      animateBackground();

      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars();
      });
    }

    // Custom Cursor
    const cursor = document.querySelector(".custom-cursor");
    if (cursor) {
      document.addEventListener("mousemove", (e) => {
        cursor.style.top = `${e.clientY}px`;
        cursor.style.left = `${e.clientX}px`;
      });

      // Hide cursor when idle
      let mouseTimeout;
      document.addEventListener("mousemove", () => {
        clearTimeout(mouseTimeout);
        cursor.style.opacity = 1;
        mouseTimeout = setTimeout(() => {
          cursor.style.opacity = 0;
        }, 2000);
      });
    }
  </script>
</body>
</html>
