<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body{
      display:flex;justify-content:center;align-items:center;
      min-height:100vh;background:#0d0d0d;color:#fff;
    }
    /* Base Responsive Setup */
img {
  max-width: 100%;
  height: auto;
}

section {
  padding: 4rem 2rem;
}

/* For Tablets (≤992px) */
@media (max-width: 992px) {
  h1 { font-size: 2.2rem; }
  h2 { font-size: 1.6rem; }
  p  { font-size: 1rem; }

  .profile-frame img {
    width: 160px;
    height: 160px;
  }

  .projects-container {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
}

/* For Phones (≤768px) */
@media (max-width: 768px) {
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  p  { font-size: 0.95rem; }
  section { padding: 3rem 1rem; }

  /* Navbar responsive */
  .navbar ul {
    flex-direction: column;
    background: rgba(0,0,0,0.95);
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    display: none;
    padding: 20px 0;
  }

  .navbar ul.active {
    display: flex;
  }

  .menu-toggle {
    display: block;
  }
}

/* For Small Phones (≤480px) */
@media (max-width: 480px) {
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; }
  p  { font-size: 0.9rem; }

  .profile-frame img {
    width: 120px;
    height: 120px;
  }

  .outline-hover {
    width: 100%;
    text-align: center;
    font-size: 0.9rem;
    padding: 0.6rem 1rem;
  }
}

    .form-box{
      width:100%;max-width:400px;background:#1c1c1c;
      padding:30px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,0.5);
    }
    h2{text-align:center;margin-bottom:20px;color:#00e5ff;}
    .input-group{margin-bottom:15px;}
    .input-group label{display:block;margin-bottom:5px;font-size:14px;}
    .input-group input{
      width:100%;padding:10px;border:none;border-radius:8px;
      outline:none;background:#2b2b2b;color:#fff;
    }
    .btn{
      width:100%;padding:12px;background:#00e5ff;color:#000;
      font-weight:bold;border:none;border-radius:8px;cursor:pointer;
      transition:0.3s;
    }
    .btn:hover{background:#00bcd4;}
    .switch{text-align:center;margin-top:15px;font-size:14px;}
    .switch a{color:#00e5ff;text-decoration:none;}
  </style>
</head>
<body>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <div class="form-box">
    <h2>Login</h2>
    <form onsubmit="redirect(event)">
      <div class="input-group">
        <label>Email</label>
        <input type="email" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" required>
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="switch">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </form>
  </div>

  <script>
    function redirect(e){
      e.preventDefault();
      window.location.href="index.html";
    }
  </script>
</body>
</html>
