<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Certificates</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #0d0d0d;
      color: #0f0;
    }

    /* Navbar reuse */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px;
      text-align: center;
      z-index: 1000;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 0;
      padding: 0;
    }

    .navbar ul li a {
      color: #0f0;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
    }

    .navbar ul li a:hover {
      color: cyan;
    }

    /* Certificates Section */
    .certificates {
      padding: 120px 20px 40px;
      text-align: center;
    }

    .certificates h1 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: cyan;
    }

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .cert-card {
      background: #1a1a1a;
      border: 1px solid #0f0;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .cert-card:hover {
      transform: translateY(-8px);
      box-shadow: 0px 0px 20px rgba(0, 255, 0, 0.5);
    }

    .cert-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid #0f0;
    }

    .cert-card h3 {
      margin: 10px 0;
      color: #0f0;
    }

    .cert-card p {
      font-size: 14px;
      padding: 0 10px 15px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <ul>
       <li><a href="index.html">Home</a></li>
      <li><a href="index.html#family">Family</a></li>
      <li><a href="index.html#work">Work</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="certificates.html">Certificates</a></li>
    </ul>
  </nav>

  <!-- Certificates Section -->
  <section class="certificates">
    <h1>My Certificates</h1>
    <div class="cert-grid">
      
      <!-- Certificate Card 1 -->
      <div class="cert-card">
       <a href="https://drive.google.com/file/d/1BVskWuPPFxP8ZQkEZT26cLRSg8upZf7N/view?usp=drivesdk"> <img src="ceritficate.png" alt="Certificate 1"></a>
        <h3>AI for Beginers</h3>
        <p></p>
      </div>

      <!-- Certificate Card 2 -->
      <div class="cert-card">
        <a href="https://drive.google.com/file/d/1BaicJOXEEdX_sZw0GTKIKHToh598Hx-P/view?usp=drivesdk"><img src="certificate2.png" alt="Certificate 2"></a>
        <h3>Data Structures & Algorithms</h3>
        <p>Recognized for excellence in solving algorithmic challenges.</p>
      </div>

      <!-- Certificate Card 3 -->
      <div class="cert-card">
       <a href="https://drive.google.com/file/d/1BbQAVlPbxQDkpyjeEw5vAXtonXthU5SC/view?usp=drivesdk"><img src="tata.png" alt="Certificate 3"></a> 
        <h3>Machine Learning</h3>
        <p>Certified in ML fundamentals and model building.</p>
      </div>

    </div>
  </section>

</body>
</html>
