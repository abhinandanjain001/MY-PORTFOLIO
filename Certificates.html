<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Abhinandan Jain</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d1117;
      color: #f3ebeb;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Responsive Container */
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #0f0;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 255, 0, 0.05);
      backdrop-filter: blur(8px);
    }

    .login-container h2 {
      color: #0f0;
      font-size: 1.6rem;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #9fe89f;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #0f0;
      color: #fff;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #00ff41;
      box-shadow: 0 0 12px rgba(0, 255, 0, 0.25);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0f0;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .login-btn:hover {
      background: #00ff41;
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .forgot-password {
      text-align: center;
      margin-top: 16px;
    }

    .forgot-password a {
      color: #9fe89f;
      font-size: 0.95rem;
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .demo-note {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #9fe89f;
    }

    /* Responsive Adjustments */
    @media (max-width: 480px) {
      .login-container {
        padding: 24px;
        border-radius: 12px;
      }

      .login-container h2 {
        font-size: 1.4rem;
      }

      .form-group input,
      .login-btn {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .login-container {
        padding: 20px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="login-container" role="form" aria-labelledby="login-heading">
    <h2 id="login-heading">Sign In</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="login-btn">Log In</button>
    </form>

    <div class="forgot-password">
      <a href="#">Forgot password?</a>
    </div>

    <p class="demo-note">
      Demo: Enter any email and password to continue.
    </p>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Logged in successfully! (Demo mode)");
    });
  </script>

</body>
</html>
