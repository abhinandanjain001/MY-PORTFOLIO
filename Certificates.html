<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Certificates</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="aj.css" />

  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #0d0d0d;
      color: #0f0;
    }
/* Base Responsive Setup */
img {
  max-width: 100%;
  height: auto;
}

section {
  padding: 4rem 2rem;
}

/* For Tablets (≤992px) */
@media (max-width: 992px) {
  h1 { font-size: 2.2rem; }
  h2 { font-size: 1.6rem; }
  p  { font-size: 1rem; }

  .profile-frame img {
    width: 160px;
    height: 160px;
  }

  .projects-container {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
}

/* For Phones (≤768px) */
@media (max-width: 768px) {
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.4rem; }
  p  { font-size: 0.95rem; }
  section { padding: 3rem 1rem; }

  /* Navbar responsive */
  .navbar ul {
    flex-direction: column;
    background: rgba(0,0,0,0.95);
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    display: none;
    padding: 20px 0;
  }

  .navbar ul.active {
    display: flex;
  }

  .menu-toggle {
    display: block;
  }
}

/* For Small Phones (≤480px) */
@media (max-width: 480px) {
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; }
  p  { font-size: 0.9rem; }

  .profile-frame img {
    width: 120px;
    height: 120px;
  }

  .outline-hover {
    width: 100%;
    text-align: center;
    font-size: 0.9rem;
    padding: 0.6rem 1rem;
  }
}

    /* Navbar reuse */
    
    /* Certificates Section */
    .certificates {
      padding: 120px 20px 40px;
      text-align: center;
    }

    .certificates h1 {
      font-size: 2rem;
      margin-bottom: 30px;
      color: cyan;
    }

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .cert-card {
      background: #1a1a1a;
      border: 1px solid #0f0;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .cert-card:hover {
      transform: translateY(-8px);
      box-shadow: 0px 0px 20px rgba(0, 255, 0, 0.5);
    }

    .cert-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid #0f0;
    }

    .cert-card h3 {
      margin: 10px 0;
      color: #0f0;
    }

    .cert-card p {
      font-size: 14px;
      padding: 0 10px 15px;
      color: #ccc;
    }
  </style>
</head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>

  <!-- Navbar -->
  <nav class="navbar">
  <span class="menu-toggle">&#9776;</span> <!-- Hamburger Icon -->
  <ul>
    <li><a href="about.html">About</a></li>
    <li><a href="family.html">Family</a></li>
    <li><a href="work.html">Work</a></li>
    <li><a href="education.html">Education</a></li>
    <li><a href="Certificates.html">Certificates</a></li>
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>


  <!-- Certificates Section -->
  <section class="certificates">
    <h1>My Certificates</h1>
    <div class="cert-grid">
      
      <!-- Certificate Card 1 -->
      <div class="cert-card">
       <a href="https://drive.google.com/file/d/1BVskWuPPFxP8ZQkEZT26cLRSg8upZf7N/view?usp=drivesdk"> <img src="ceritficate.png" alt="Certificate 1"></a>
        <h3>AI for Beginers</h3>
        <p>learn basics of Ai by Hp-Life</p>
      </div>

      <!-- Certificate Card 2 -->
      <div class="cert-card">
        <a href="https://drive.google.com/file/d/1BaicJOXEEdX_sZw0GTKIKHToh598Hx-P/view?usp=drivesdk"><img src="certificate2.png" alt="Certificate 2"></a>
        <h3>Technology Job Simulation</h3>
        <p>A 3 hour Internship from Deloitte on Technology Simulation.</p>
      </div>

      <!-- Certificate Card 3 -->
      <div class="cert-card">
       <a href="https://drive.google.com/file/d/1BbQAVlPbxQDkpyjeEw5vAXtonXthU5SC/view?usp=drivesdk"><img src="tata.png" alt="Certificate 3"></a> 
        <h3>Gen AI </h3>
        <p>GenAI Powered Data Analytics Job Simulation.</p>
      </div>

    </div>
  </section>
  <script >
    const menuToggle = document.querySelector(".menu-toggle");
const navMenu = document.querySelector(".navbar ul");

menuToggle.addEventListener("click", () => {
  navMenu.classList.toggle("active");
});

// Close menu when clicking a link
document.querySelectorAll(".navbar a").forEach(link => {
  link.addEventListener("click", () => {
    navMenu.classList.remove("active");
  });
});

  </script>

</body>
</html>
