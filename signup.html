<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body{
      display:flex;justify-content:center;align-items:center;
      min-height:100vh;background:#0d0d0d;color:#fff;
    }
    .form-box{
      width:100%;max-width:400px;background:#1c1c1c;
      padding:30px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,0.5);
    }
    h2{text-align:center;margin-bottom:20px;color:#00e5ff;}
    .input-group{margin-bottom:15px;}
    .input-group label{display:block;margin-bottom:5px;font-size:14px;}
    .input-group input{
      width:100%;padding:10px;border:none;border-radius:8px;
      outline:none;background:#2b2b2b;color:#fff;
    }
    .btn{
      width:100%;padding:12px;background:#00e5ff;color:#000;
      font-weight:bold;border:none;border-radius:8px;cursor:pointer;
      transition:0.3s;
    }
    .btn:hover{background:#00bcd4;}
    .switch{text-align:center;margin-top:15px;font-size:14px;}
    .switch a{color:#00e5ff;text-decoration:none;}
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Sign Up</h2>
    <form onsubmit="redirect(event)">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" required>
      </div>
      <button type="submit" class="btn">Sign Up</button>
      <div class="switch">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </form>
  </div>

  <script>
    function redirect(e){
      e.preventDefault();
      window.location.href="index.html";
    }
  </script>
</body>
</html>
